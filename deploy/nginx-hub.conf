# 加入 /etc/nginx/nginx.conf 中 xjtuaep.com 的 HTTPS server 块内。
# 保留现有 /admin/、/api/assistant/chat、/lounge/ 路由不动。

# 模型接口：个人 Key 直连 New API，保持流式输出
location ^~ /hub/v1/ {
    proxy_pass http://127.0.0.1:12221/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 10m;
}

# 业务服务（登录、会话、额度、算力）
location ^~ /hub-api/ {
    proxy_pass http://127.0.0.1:18889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;              # 聊天 SSE
    proxy_read_timeout 300s;
    client_max_body_size 10m;         # 图片附件
}

# Hub 前端（同一服务提供，含刷新回退）
location ^~ /hub/ {
    proxy_pass http://127.0.0.1:18889;
    proxy_set_header Host $host;
}
location = /hub { return 301 /hub/; }
